version: "3.8"

services:
  tos7-app-01-memos:
    image: neosmemo/memos:0.24.0
    container_name: tos7-app-01-memos
    restart: unless-stopped
    ports:
      - "18081:5230"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/tos7-app-01-memos/data:/var/opt/memos
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5230/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

x-app-meta:
  web:
    port: 18081
    protocol: http
